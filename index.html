<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" aria-live="polite"></p>
  <p id="topic"></p>
  <pre id="draft"></pre>
  <script type="module">
    const VIEWS = {
      loading: "Разбираем заявку…",
      ready: "Готово. Проверьте черновик перед отправкой.",
      manual_review: "Автоматический разбор не удался. Обработайте заявку вручную.",
      invalid_input: "Введите текст заявки.",
      error: "Сервис не отвечает. Повторите попытку или обработайте заявку вручную.",
    };
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цены", other: "Другое" };
    const CONTRACT_STATUSES = ["ready", "manual_review", "invalid_input"];

    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const message = document.querySelector("#message");
    const statusLine = document.querySelector("#status");
    const topicLine = document.querySelector("#topic");
    const draftBox = document.querySelector("#draft");

    // Every state writes all three slots, so an old draft never survives.
    function render(state, data = {}) {
      const ready = state === "ready";
      statusLine.textContent = VIEWS[state];
      topicLine.textContent = ready ? `Тема: ${TOPIC_LABELS[data.topic] ?? data.topic}` : "";
      draftBox.textContent = ready ? data.draft : "";
    }

    async function requestTriage(text) {
      const reply = await fetch("/api/triage", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      const body = await reply.json();
      return CONTRACT_STATUSES.includes(body.status) ? body : { status: "error" };
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      render("loading");
      try {
        const body = await requestTriage(message.value);
        render(body.status, body);
      } catch {
        render("error");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
